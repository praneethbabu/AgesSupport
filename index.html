<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title -->
    <title>
      Aegis Support Services | NDIS Disability & Community Care Provider
    </title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Aegis Support Services provides trusted NDIS disability support, community participation, personal care, behaviour support, and allied health services across Australia."
    />
    <meta
      name="keywords"
      content="Aegis Support, NDIS Provider, Disability Support Services, Behaviour Support, Community Participation, Personal Care, Allied Health, NDIS Australia"
    />
    <meta name="author" content="Aegis Support Services" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="Aegis Support Services | NDIS Care You Can Trust" />
    <meta
      property="og:description"
      content="Compassionate and professional NDIS support services helping individuals live independently and confidently."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aegissupport.com.au" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aegis Support Services | NDIS Disability Care" />
    <meta
      name="twitter:description"
      content="Trusted NDIS disability and community care services across Australia."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme Color (Mobile Browser) -->
    <meta name="theme-color" content="#0a74da" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
